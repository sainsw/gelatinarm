name: Build

# Builds the app on Windows (UWP has no Linux toolchain) so changes can be checked and a
# sideload package installed through the Xbox Device Portal without a local Windows machine.
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4

      # The build runs XAML Styler through the .NET SDK
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - uses: microsoft/setup-msbuild@v2

      # DEV_SETUP.md's gate: judged from a rebuild, nothing but .NET Native's ILT0005 allowed
      - name: Rebuild (Debug) and check warnings
        shell: pwsh
        run: |
          msbuild Gelatinarm.csproj /restore /t:Rebuild /p:Configuration=Debug /p:Platform=x64 `
            /p:AppxPackageSigningEnabled=false /nologo /v:minimal /m `
            "/flp:WarningsOnly;LogFile=warnings.log"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $warnings = Get-Content warnings.log | Where-Object { $_ -match 'warning' -and $_ -notmatch 'ILT0005' } |
            Sort-Object -Unique
          if ($warnings) {
            $warnings | ForEach-Object { Write-Host "::warning::$_" }
            Write-Error "$(@($warnings).Count) warning(s) beyond ILT0005"
            exit 1
          }

      # Sideloading needs a signed package; the certificate is made per run and shipped with it
      # (the publisher must match the manifest's)
      - name: Create signing certificate
        shell: pwsh
        run: |
          $publisher = ([xml](Get-Content Package.appxmanifest)).Package.Identity.Publisher
          $cert = New-SelfSignedCertificate -Type Custom -Subject $publisher `
            -KeyUsage DigitalSignature -FriendlyName "Gelatinarm CI" `
            -CertStoreLocation Cert:\CurrentUser\My `
            -TextExtension @("2.5.29.37={text}1.3.6.1.5.5.7.3.3", "2.5.29.19={text}")
          $password = ConvertTo-SecureString -String "ci" -Force -AsPlainText
          Export-PfxCertificate -Cert $cert -FilePath ci.pfx -Password $password | Out-Null
          New-Item -ItemType Directory -Force AppPackages | Out-Null
          Export-Certificate -Cert $cert -FilePath AppPackages\Gelatinarm-CI.cer | Out-Null

      - name: Build sideload package (Release)
        shell: pwsh
        run: |
          msbuild Gelatinarm.csproj /restore /p:Configuration=Release /p:Platform=x64 `
            /p:UapAppxPackageBuildMode=SideloadOnly /p:AppxBundle=Always `
            /p:PackageCertificateKeyFile="$PWD\ci.pfx" /p:PackageCertificatePassword=ci `
            /p:AppxPackageDir="$PWD\AppPackages\\" /nologo /v:minimal /m
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - uses: actions/upload-artifact@v4
        with:
          name: Gelatinarm-sideload
          path: AppPackages
